# Создаёт метки для бонусов XP и бейджей. Обычно не нужен: метки создаются
# сами при первой сдаче квеста. Можно запустить вручную: Actions → Run workflow.
name: Метки для ревью

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths: [".github/labels.sh"]

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/labels.sh
