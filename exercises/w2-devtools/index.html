<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Профиль героя</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="profile">
    <img class="avatar" src="img/hero.png" alt="Портрет героя">
    <h1 class="title">Кибер-рыцарь</h1>
    <p class="level">Уровень 12</p>

    <ul class="stats">
      <li>Сила: 18</li>
      <li>Ловкость: 14</li>
      <li>Интеллект: 20</li>
    </ul>

    <div class="secret">
      Секретный приём: двойной прыжок + удар щитом
    </div>

    <div class="inventory">
      <div class="slot">🗡️</div>
      <div class="slot">🛡️</div>
      <div class="slot">🧪</div>
      <div class="slot">💎</div>
    </div>

    <button class="join">Вступить в гильдию</button>
  </main>
</body>
</html>
